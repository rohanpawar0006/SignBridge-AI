name: SignBridge AI CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Test Suite & ML Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install PyTorch (CPU) & Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run PyTorch Model Evaluation
        run: |
          python scripts/evaluate_model.py

      - name: Run Automated Backend Tests
        run: |
          python backend/test_backend.py

  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Verify Frontend Production Build
        working-directory: ./frontend
        run: npm run build
